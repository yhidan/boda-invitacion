<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Matrimonio Samuel & Natalia</title>
  <style>
    body {
      margin: 0;
      font-family: 'Georgia', serif;
      background: linear-gradient(to bottom, #fff8f0, #fce4ec);
      color: #333;
      text-align: center;
      height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      overflow: hidden;
    }

    /* Banner elegante */
    .banner {
      background: url('img/banner2.jpg') center/cover no-repeat;
      width: 100%;
      height: 50vh;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      text-shadow: 2px 2px 6px rgba(0,0,0,0.6);
      position: relative;
    }
    .banner::before {
      content: "";
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.3); /* overlay semitransparente */
    }
    .banner h1 {
      position: relative;
      z-index: 2;
      font-size: 3rem;
      margin: 0;
    }

    /* Botón central */
    .btn {
      margin-top: 2rem;
      padding: 1rem 2rem;
      background-color: #6956d8;
      color: white;
      text-decoration: none;
      border-radius: 30px;
      font-size: 1.5rem;
      transition: background 0.3s;
      z-index: 2;
    }
    .btn:hover {
      background-color: #880e4f;
    }

    /* Footer con logo */
    footer {
      margin-top: 3rem;
      z-index: 2;
    }
    footer img {
      width: 100px;
      height: auto;
      display: block;
      margin: 0 auto 1rem;
    }
    footer p {
      font-size: 1rem;
      color: #555;
    }

    /* Animaciones corazones y estrellas */
    .floating {
      position: fixed;
      bottom: -50px;
      font-size: 1.8rem;
      animation: floatUp linear forwards;
      z-index: 9999;
      pointer-events: none;
    }
    .star { color: gold; }
    .heart { color: #b71c1c; }
    @keyframes floatUp {
      from { transform: translateY(0); opacity: 1; }
      to { transform: translateY(-120vh); opacity: 0; }
    }

    @media (max-width: 600px) {
      .banner h1 { font-size: 2rem; }
      .btn { font-size: 1.2rem; }
    }
  </style>
</head>
<body>
  <!-- Banner principal -->
  <div class="banner">
    <h1>¡Nuestra Boda!</h1>
  </div>

  <!-- Botón central -->
  <a href="https://regalanovios.com/weddings/proyecto-boda-318" class="btn">Más información</a>

  <!-- Footer con logo -->
  <footer>
    <img src="img/logo2.png" alt="Logo boda">
    <p>Con cariño, Samuel & Natalia</p>
  </footer>

  <!-- Script corazones y estrellas -->
  <script>
    function createFloatingSymbol(symbol, className) {
      const elem = document.createElement("div");
      elem.className = "floating " + className;
      elem.textContent = symbol;
      elem.style.left = Math.random() * 100 + "vw";
      elem.style.animationDuration = (3 + Math.random() * 4) + "s";
      document.body.appendChild(elem);
      setTimeout(() => elem.remove(), 8000);
    }

    setInterval(() => {
      if (Math.random() > 0.5) {
        createFloatingSymbol("❤", "heart");
      } else {
        createFloatingSymbol("★", "star");
      }
    }, 400);
  </script>
</body>
</html>
